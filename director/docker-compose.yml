# Pinned so the project name does not follow the directory name. This stack was
# born in its own repo (/opt/marshall-director) and its Postgres volume is
# marshall-director_pgdata; after the move under marshall/director/ compose would
# otherwise derive the project from the folder ("director"), mount a brand-new
# empty volume, and silently come up with no contacts, sessions or approaches.
name: marshall-director

services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_USER: strands
      POSTGRES_PASSWORD: strands
      POSTGRES_DB: strands
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # PUBLISHED SO THE BRIDGE CAN REACH IT. The bridge is a host process, not
      # a container, so without this it could not query Postgres at all -- every
      # board read had to be an HTTP call to a hand-written handler, and twelve
      # CRUD endpoints grew in front of a database everybody could have read.
      #
      # Bound to the LAN, unauthenticated beyond the password, exactly the
      # posture DCS-gRPC on 50051 already has. Do not expose this beyond the
      # LAN: it is the whole world model.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strands -d strands"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent:
    build:
      # The repo root, so the image can carry `src/marshall`. Paths inside the
      # Dockerfile are therefore repo-relative.
      context: ..
      dockerfile: director/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STRANDS_PG_DSN: postgresql://strands:strands@db:5432/strands
      # MUST MATCH THE DOCKERFILE'S, not replace it. compose `environment:`
      # OVERRIDES the image's ENV rather than extending it, and setting this to
      # bare /app silently dropped `/app/_grpc` -- every DCS stub import failed
      # with "No module named 'dcs'" and the radar went dead. `marshall` is
      # importable because it is mounted at /app/marshall, which was already
      # first on this path.
      PYTHONPATH: /app:/app/_grpc
    volumes:
      # Only needed for Option A (AWS_PROFILE with SSO/SAML/STS creds).
      # rw so boto3 can refresh SSO tokens into ~/.aws/sso/cache.
      # If you're using static IAM user keys (Option B in .env.example),
      # DELETE this volume block — the bind mount fails on hosts without
      # ~/.aws (typical VPS / fresh LXC).
      - ${HOME}/.aws:/root/.aws
      # THE SOURCE, MOUNTED OVER WHAT THE IMAGE BAKED IN.
      #
      # Without these, `docker compose restart` runs the code from the last
      # BUILD, silently. It cost a debugging cycle on 31 July: the tracks fix
      # was edited, the container restarted, /radar kept returning the old
      # answer, and the obvious reading was that the fix was wrong. A container
      # that ignores your edits and reports success is indistinguishable from a
      # bug in the edit.
      #
      # The Dockerfile still COPYs all of these, so an image built from here is
      # self-contained and deploys anywhere. These only override them in place,
      # which is what a machine you are editing on wants. `restart` now picks up
      # a code change; `--build` is only needed for dependencies.
      # THE SHARED CODE. `core` is below both deployables -- one squash, one
      # bearing, one schema -- and until this line existed the director COULD
      # NOT IMPORT IT. That is not an inconvenience, it is the cause: `_key`
      # was written three times and "bearing between two points" seven, because
      # duplicating was the only thing available. See docs/STRUCTURE.md.
      - ../src/marshall:/app/marshall
      - ./tools:/app/tools
      - ./prompts:/app/prompts
      - ./app.py:/app/app.py
      - ./migrations:/app/migrations
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Uncomment if your agent has a browser tool (Playwright/CDP driving). Used
  # for scraping or automating websites your domain tools need to reach.
  # The agent talks to chromium over CDP at http://chromium:3000 — point your
  # Playwright connect() at ws://chromium:3000 or http://chromium:3000 per
  # browserless's docs. ~1.5GB image; skip this block if you don't need it.
  # chromium:
  #   image: browserless/chrome:latest
  #   environment:
  #     CONNECTION_TIMEOUT: "60000"
  #     MAX_CONCURRENT_SESSIONS: "3"
  #   shm_size: 2gb
  #   restart: unless-stopped

  # Uncomment to expose the domain schema as a REST API (PostgREST).
  # Requires a role migration granting SELECT to web_anon on your tables;
  # see https://github.com/peterb154/strands-pgsql-agent-framework for the
  # pattern.
  # postgrest:
  #   image: postgrest/postgrest:v12.2.0
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     PGRST_DB_URI: postgres://strands:strands@db:5432/strands
  #     PGRST_DB_SCHEMAS: api
  #     PGRST_DB_EXTRA_SEARCH_PATH: "api, public"
  #     PGRST_DB_ANON_ROLE: web_anon
  #   ports:
  #     - "3000:3000"
  #   restart: unless-stopped

volumes:
  pgdata:

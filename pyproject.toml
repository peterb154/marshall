[project]
name = "marshall"
version = "0.1.0"
description = "Procedural radio ATC, mission generation and kneeboard charts for flight sims"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "peterb154" }]
# core / kneeboard / atc are pure-Python (stdlib only), so the servers stay
# tiny. Only the mission generator needs pydcs -- install marshall[mission].
dependencies = []

[project.optional-dependencies]
mission = ["pydcs>=0.15.0"]
dev = ["pydcs>=0.15.0", "luaparser>=3.2"]

# Entry points are run as modules (python -m marshall.<pkg>.<mod>); no console
# scripts yet.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marshall"]

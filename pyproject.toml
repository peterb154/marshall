[project]
name = "marshall"
version = "0.1.0"
description = "Procedural radio ATC, mission generation and kneeboard charts for flight sims"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "peterb154" }]
# core / atc and the chart *generators* are pure-Python (stdlib only), so the
# brain stays testable in plain text with no install. Only two things pull deps:
# the HTTP server (marshall[server]) and the mission generator (marshall[mission]).
dependencies = []

[project.optional-dependencies]
# The kneeboard / flight-planning web server. uvicorn gives the per-connection
# concurrency OpenKneeboard's keep-alive Chromium needs (see docs/GOTCHAS.md).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# The SRS voice bridge: TTS -> Opus -> SRS transmit. boto3 drives Polly.
voice = ["opuslib>=3.0", "numpy>=1.26", "soxr>=0.5", "boto3>=1.34"]
mission = ["pydcs>=0.15.0"]
dev = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydcs>=0.15.0", "luaparser>=3.2"]

# Entry points are run as modules (python -m marshall.<pkg>.<mod>); no console
# scripts yet.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marshall"]

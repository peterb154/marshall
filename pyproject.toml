[project]
name = "marshall"
version = "0.1.0"
description = "Procedural radio ATC, mission generation and kneeboard charts for flight sims"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "peterb154" }]
dependencies = [
    "pydcs>=0.15.0",
]

[project.optional-dependencies]
dev = ["luaparser>=3.2"]

[project.scripts]
marshall-kneeboard = "marshall.kneeboard.site:main"
marshall-serve = "marshall.kneeboard.serve:main"
marshall-atc = "marshall.atc.controller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marshall"]

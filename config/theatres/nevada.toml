# Nevada (NTTR).
#
# THE MAP ITSELF IS A TABLE, as the Caucasus has been since the approaches
# moved. This file was the navaids and nothing else while the fields, the
# seats, the fixes and the two ILS procedures stayed in `core/nevada.py` --
# so one map was rows and the other was code, and every rule in
# docs/CONFIG.md applied to one of them. See #137.

[theatre]
name = "Nevada"
terrain = "Nevada"
departure = "Nellis"
# NO `arrival`, NO `default_approach`, NO `bootstrap_plan`, and the absence is
# the honest answer rather than an omission. Nevada has TWO filed sorties --
# Nellis there-and-back, and the one-way transit to Tonopah -- and they recover
# at different fields, so where you land is a fact about which sortie is being
# flown and not about the map. `MARSHALL_SORTIE` picks one; see
# `theatre.NEVADA_SORTIES`, and #111, which is per-flight selection and deletes
# the choice entirely.
#
# Writing the Nellis recovery here as a "default" would put a second copy of it
# beside that table, and two copies of one fact is what this whole migration is
# for.
#
# NINE MILES AN HOUR FROM 210 -- eight knots -- AND IT PICKS BOTH RUNWAYS. Nellis lands 21
# (209 magnetic) and Tonopah lands 15 (141 magnetic) in it -- the departure end
# and the arrival end agree, without anybody special-casing either, which is
# the same thing the Caucasus easterly buys at Batumi and Kobuleti. What this
# IS: the wind the .miz is built with, and therefore the wind the ATIS then
# measures. Anything spoken reads the measurement (`atis.store.wind`).
wind_from_deg = 210.0
wind_mph = 9.2

# Nothing here yet needs respelling: Polly says "Nellis" and "Tonopah" the way
# a controller does. The table is present rather than absent on purpose --
# `catalogue.py` treats a MISSING theatre file as an error, because a map with
# no configuration is far more likely to be a typo in MARSHALL_THEATRE than a
# map that genuinely needs none. An empty table says "checked, nothing needed".

[pronunciation]

[recogniser]
phrases = ["Nellis", "Tonopah", "Creech", "Groom Lake", "Las Vegas",
           "Nellis Approach", "Nellis Tower"]

# --- published fixes -------------------------------------------------------
#
# WHAT MAKES A FIX PUBLISHED is that somebody else can look it up. Both of
# these are: the aerodrome a pilot is going to, and the enroute VORTAC the leg
# between the two fields is flown on. Nothing invented, and this map has no
# strike route whose turning points could leak into the catalogue the way the
# 362nd's did (#137).
#
# THE ONE THING THIS MIGRATION HAD TO ADD is lat/lon, because `PublishedFix`
# requires them and the Python `Fix` objects carried grid metres and nothing
# else -- which is the first finding of the #137 audit, arriving here a map
# late. Neither figure is measured afresh: each is the projection this tree
# already publishes for the SAME grid point, and each `source` says which and
# admits the Python cited nothing. No other value below was touched.
#
# A BEACON IS NOT AN AIRFIELD, and NELLIS is the fault a68151353 named at
# Batumi, on a second map. Its position is the aerodrome reference point, its
# ident and note are the LSV TACAN's, and the real LSV sits 1,250 m away in the
# [[navaid]] table of this same file. Preserved exactly as it was; see #163.

[[fix]]
name = "NELLIS"
ident = "LSV"
x = -398195
z = -17233
freq_mhz = 0.0
sector = "Nellis Approach"
lat = 36.2352
lon = -115.0330
source = "pydcs Nevada terrain, Nellis airport point -- the same x/z and the same lat/lon as the [[field]] below, because it IS the aerodrome reference. The Python this was migrated from carried no lat/lon at all."
note = "Nellis TACAN 12X. Field reference for the ILS to 21L."

[[fix]]
name = "TONOPAH"
ident = "TPH"
x = -200809
z = -196936
freq_mhz = 117.2
sector = "Silverbow Approach"
lat = 38.030667
lon = -117.0335
source = "nevada-Beacons.lua: the TPH VORTAC's own positionGeo, at the same grid point to within a metre -- see the [[navaid]] TPH below. The Python this was migrated from carried no lat/lon at all."
note = "Tonopah VORTAC, channel 119. Enroute, not an airfield beacon."

# --- aerodromes ------------------------------------------------------------
#
# `runway` is the landing heading MAGNETIC; `ends` are the DESIGNATORS painted
# on the tarmac, and they are separate data rather than the heading rounded.
# Nevada proves the rule on a second map: Tonopah's heading is 141, which
# rounds to 14, and the paint says 15.
#
# ORDER MATTERS IN `ends`: `ends[0]` is the end whose heading is `runway`. 209
# is the 21 end, so Nellis is (21, 3) -- written the other way round first, and
# `runway_in_use` then named runway 03 in a 210 wind, which is the downwind end
# of its own ILS runway.
#
# NELLIS HAS TWO PARALLEL RUNWAYS, 03L/21R and 03R/21L, and one field row
# models one pair. The ILS is on 21L, so that is the pair described. A
# parallel-runway field wants an L/R designator on the end; noted rather than
# papered over.
#
# BOTH MVA GRIDS WERE SURVEYED, 10 August, with `tools/survey_terrain.py` --
# `land.getHeight` over twelve 30-degree spokes and rings at 5, 10, 15 and
# 25 nm, highest ground in each cell plus a thousand feet, rounded up to the
# next five hundred. Borrowing Batumi's cells would not have been conservative
# here, it would have been fiction: Nellis has 2,000 ft under the approach and
# 9,416 ft twenty-five miles north-west, and Tonopah has no ground below
# 6,500 ft anywhere within twenty-five miles.
#
# Neither field publishes an MSA, so `msa_sectors` is absent rather than
# invented, and `min_safe_ft` falls through to the surveyed cells.

[[field]]
name = "Nellis"
x = -398195
z = -17233
lat = 36.2352
lon = -115.033
elevation_ft = 1869
runway = 209
ends = [21, 3]
atis_mhz = 118.4

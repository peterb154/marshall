# --- controllers -----------------------------------------------------------
#
# THE LADDER, from the published plate, and IN LADDER ORDER -- `channels_for`
# takes the first presets in file order and `"ABCD"[i]` indexes the buttons.
# Nellis outbound is clearance, ground, tower, departure, approach; Tonopah is
# written approach-first because that is the order a pilot arriving there
# presses them, and tower-first put the recovery controller below the man who
# takes you at four miles.
#
# DCS ITSELF MODELS ONE CONTROLLER AT NELLIS -- "NellisControl", ground, tower
# and approach on 132.550 -- which happens to be the real Tower frequency. So
# Tower's rung agrees with what the mission editor shows a pilot and the rest
# are the positions that genuinely exist. Same happy accident at Tonopah, where
# DCS's "Silverbow" on 124.750 is the real Tower.
#
# NELLIS GROUND ON 121.800 IS ALSO KOBULETI GROUND'S NUMBER. Harmless -- they
# are on different maps and never loaded together -- but it is exactly the sort
# of coincidence that makes a wrong answer look right, so it is written down.
#
# LOS ANGELES CENTER has no `field`, and that is not an omission: a Center owns
# a REGION and hands you between aerodromes. Without it a departure worked
# cleanly through Clearance, Ground, Tower and Departure and then simply stayed
# with Departure for the rest of the sortie -- `handoff.RULES` routes an
# outbound aircraft to `center` at 25 nm and there was nobody to route him to
# (#110). 133.400 is one of ZLA's sector frequencies and is CHOSEN rather than
# surveyed, like Georgia Center's number, and it is said here so nobody later
# mistakes it for a plate value.
#
# NOT THE RANGE. Real NTTR range work is Nellis Control -- "Blackjack" -- a
# different service with different phraseology and its own airspace, and none
# of it is modelled. A range mission is not a transit.

[[station]]
name = "Nellis Clearance"
freq_mhz = 120.9
role = "clearance"
field = "Nellis"
also = ["delivery"]
voice = "Gregory"
manner = "Brisk and procedural. Reads a clearance the way a man reads a form, and will make you read it back again if you fumble it."

[[station]]
name = "Nellis Ground"
freq_mhz = 121.8
role = "ground"
field = "Nellis"
voice = "Joey"
manner = "Unhurried and faintly amused. Knows every taxiway and expects you to know the one he just gave you."

[[station]]
name = "Nellis Tower"
freq_mhz = 132.55
role = "tower"
field = "Nellis"
channels = [327.0]
voice = "Matthew"
manner = "Clipped. Owns the runway and nothing else, and says so when asked for something that is not his."

[[station]]
name = "Nellis Departure"
freq_mhz = 135.1
role = "departure"
field = "Nellis"
voice = "Stephen"
manner = "The same man as Approach, going the other way, and just as short about it."

[[station]]
name = "Nellis Approach"
freq_mhz = 118.125
role = "approach"
field = "Nellis"
voice = "Stephen"
manner = "Calm and economical, the way somebody sounds when the terrain is high and he has done this a great many times."

[[station]]
name = "Silverbow Approach"
freq_mhz = 119.45
role = "approach"
field = "Tonopah"
also = ["departure"]
channels = [233.95]
voice = "Stephen"
manner = "Careful about terrain and says so. The valley floor is high and the ridges are higher."

[[station]]
name = "Silverbow Tower"
freq_mhz = 124.75
role = "tower"
field = "Tonopah"
also = ["clearance", "delivery"]
channels = [257.95]
voice = "Matthew"
manner = "Dry and unhurried. Works the runway and the clearances both, because nobody staffs a delivery position out here."

[[station]]
name = "Silverbow Ground"
freq_mhz = 127.25
role = "ground"
field = "Tonopah"
channels = [335.5]
voice = "Joey"
manner = "Laconic. It is a test range and there is rarely anybody else moving."

[[station]]
name = "Los Angeles Center"
freq_mhz = 133.4
role = "center"
voice = "Brian"
manner = "Unhurried and a long way off, working in whole minutes and hundreds of miles. A high-desert sector with very little in it, so he is never rushed and never chatty. Formal without being stiff."

# --- approaches ------------------------------------------------------------
#
# ONE PROCEDURE PER TABLE, and the fixes are NAMED rather than repeated. Both
# are `guidance = "intercept"`: an ILS puts the glidepath in the aeroplane, so
# the controller vectors him to the localiser and stops flying it for him.
# That one field is what separates these from the Batumi talkdown.
#
# `min_hat_ft = 200` is what says this is an ILS at all -- a Category I
# decision height. Transcribing the ASR's seven hundred onto an ILS is the
# mistake that field exists to prevent.
#
# THE HOLDING CEILINGS ARE NOT THE DEFAULT AND COULD NOT BE. `hold_top_ft`
# defaults to 10,000 -- "P-51: oxygen, not airspace" -- which is right for a
# Mustang and meaningless for an F-16 over Nevada. Nellis's own MVA reaches
# 10,500 north-west, so the default ceiling sits BELOW the ground a holding
# aircraft has to clear; and at Tonopah a base of 12,000 against a 10,000
# ceiling makes `stack_ft` an EMPTY list, so the controller would have had no
# level to give the first arrival at all.
#
# `final_crs_true_measured` comes out of the sim's own Beacons.lua: the
# localiser antenna sits beyond the STOP end and radiates back up the approach,
# so the course flown is its bearing plus 180. Nellis 40.11 -> 220.11 true,
# which at 12 east is 208 magnetic on a runway painted 21; Tonopah's I-RVP
# 337.08 -> 157.08, which at 16 east is 141 on a runway painted 15. The sim,
# the plate and the arithmetic agree.
#
# `grid_convergence_deg` was measured per field, the way SCHEMA.md prescribes,
# and CROSS-CHECKED: convergence on a transverse Mercator is
# (lambda - lambda0) * sin(phi), so each field implies a central meridian.
# Nellis gives -116.995 and Tonopah -116.992 -- two measurements a hundred and
# twenty miles apart agreeing on a round -117, which is a check Batumi's single
# value never had.
#
# WHAT IS DELIBERATELY ABSENT: `stations`, `msa_sectors` and `mva_cells`. The
# minimum altitudes are composed back in from the FIELD named here, so there is
# one copy and an approach cannot come to disagree with the aerodrome it
# serves.
#
# STILL NOT MODELLED, and stated so it cannot be quietly forgotten: SIDs, STARs
# and every other instrument procedure. Tonopah has an ILS to BOTH ends in the
# sim -- I-RVP to 15 and I-UVV on 111.700 to 33 -- and only 15 is built.

[[approach]]
key = "nellis-ils"
field = "Nellis"
controller = "Nellis Approach"
beacon = "NELLIS"
outer_hold = "TONOPAH"
iaf = "TONOPAH"
hold_base_ft = 9000
hold_top_ft = 16000
kind = "ils"
guidance = "intercept"
final_intercept_nm = 12.0
fap_nm = 7.0
map_nm = 0.5
touchdown_offset_nm = 0.83
grid_convergence_deg = 1.16
iaf_alt_ft = 11000
field_thr_elev_ft = 1869
chart_name = "KLSV ILS OR LOC X RWY 21L"
altimeter_datum = "QNH"
magvar_deg = 12.0
final_crs_true_measured = 220.11
final_crs = 209
field_elev_ft = 1869
runway = "21"
platform_ft = 6000
ceiling_ft = 400
min_hat_ft = 200

[approach.atc]
radar = true
dme = true
separation = "radar"
era = "modern"

[[approach]]
key = "tonopah-ils"
field = "Tonopah"
controller = "Silverbow Approach"
beacon = "TONOPAH"
outer_hold = "TONOPAH"
iaf = "TONOPAH"
hold_base_ft = 12000
hold_top_ft = 20000
kind = "ils"
guidance = "intercept"
final_intercept_nm = 12.0
fap_nm = 7.0
map_nm = 0.5
touchdown_offset_nm = 0.99
grid_convergence_deg = 0.13

magvar_deg = 12.0
grid_convergence_deg = 1.16
note = "Nellis AFB (KLSV). Field elevation 1,869 ft -- a mile above Batumi, which is the first thing here that has never been exercised. 03R/21L 10,051 x 150 ft, ILS on 21L. TACAN LSV 12X. Parallel 03L/21R not modelled. MVA surveyed 10 August."

# --- aerodromes ------------------------------------------------------------
#
# ADDING ONE IS ADDING A TABLE HERE. It used to mean editing core/fields.py,
# appending to a FIELDS tuple and redeploying the bridge, which is the whole of
# 'we're going to add dozens of airfields' stated as a code change.
#
# `runway` is the landing heading MAGNETIC; `ends` are the DESIGNATORS painted
# on the tarmac, and they are data rather than the heading rounded. Batumi's
# heading is 124, which rounds to 12 -- and DCS does call it 12 -- while the
# current AIP plate says 13/31 because magnetic drift renamed it and the paint
# caught up. Rounding gave 'runway 12' and 'runway 06', the numbers on nobody's
# chart. See #125 for the three magnetic variations this theatre has.
#
# msa_sectors are (from_bearing, to_bearing, altitude_ft); mva_cells are
# (from_bearing, to_bearing, range_nm, altitude_ft), sampled off the terrain.


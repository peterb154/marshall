key = "batumi-asr-13"
field = "Batumi"
controller = "Batumi Approach"
outer_hold = "KOBULETI"
hold_base_ft = 4000
cloud_thickness_ft = 3000
vmc_margin_ft = 1000
hold_step_ft = 1000
hold_top_ft = 10000

# Caucasus.
#
# THE MAP ITSELF IS A TABLE. `THEATRES = {"caucasus": caucasus, "nevada":
# nevada}` made adding a map mean writing a Python function; the identity of a
# theatre -- where the sortie starts and ends, which recovery is flown unless
# somebody says otherwise, what the wind is doing -- is data about the world.

[theatre]
name = "Caucasus"
terrain = "Caucasus"
departure = "Kobuleti"
arrival = "Batumi"
# NO `default_approach`, as Nevada has never had one. It read
# `batumi-asr-13` and it was the last thing choosing an arrival for the whole
# radio: which approach you are flying is a fact about your CLEARANCE, and
# until you have asked for one the honest answer is that the controller has
# none for you. The map publishes four procedures in `[[approach]]` below and
# offers all four; Approach issues one of them to one aeroplane. [#162]
bootstrap_plan = "362nd-kobuleti-batumi"
# FIVE KNOTS FROM THE EAST, and it is the runways that chose it. The wind is
# what makes a runway the runway in use, and 180 favoured neither end of
# Batumi's 13/31 -- a pure crosswind, so landing 13 was a decision the mission
# had made rather than one the weather justified. 090 fixes both ends of the
# route at once: Batumi 13 (125 magnetic) and Kobuleti 07 (064 magnetic) are
# both into the easterly, so the departure and the arrival agree without
# anybody special-casing either. It was 20 mph from 270 before that, and a
# stiff crosswind is a poor thing to debug an approach in -- every heading
# correction had a wind component buried in it, so "he put me left of course"
# and "I drifted left of course" looked identical from both ends.
#
# WHAT THIS IS. The wind the MISSION IS BUILT WITH: `mission/build.py` writes
# it into the .miz weather, so it is the number the sim then has, and `atis/`
# measures that back at ten metres over each field. Anything SPOKEN reads the
# measurement (`atis.store.wind`); this is the fallback for everything that
# runs with no sim -- the plate, the nav log, the builder itself. Changing it
# changes the weather the ATIS will observe, and with it the runway in use.
wind_from_deg = 90.0
wind_mph = 5.7539

#
# Georgian place names, and the previous spellings were a disaster on the air.
# They used CAPITALS for the stressed syllable -- "Koh boo LEH tee" -- which is
# a convention for a human reader and nothing at all to Polly: a capitalised
# fragment gets read as an initialism or simply flattened, so the emphasis
# never landed and the seams between syllables did.
#
# Lower case throughout, and syllables joined with HYPHENS rather than spaces:
# a space is a word boundary and Polly pauses at it, which is what turned
# three-syllable place names into three separate words.

[pronunciation]
Batumi = "bah-too-mee"
Kobuleti = "koh-boo-lay-tee"
Senaki = "seh-nah-kee"
Kutaisi = "koo-tah-ee-see"
Sukhumi = "soo-koo-mee"
Vaziani = "vah-zee-ah-nee"
Tsutsnvati = "tsoots-nah-vah-tee"
Gudauta = "goo-dah-oo-tah"
Soganlug = "soh-gahn-loog"
Tbilisi = "tbil-ee-see"

# Names Whisper should expect on this map. Aerodromes and published fixes --
# NOT callsigns, which belong to whoever is flying today.
[recogniser]
phrases = ["Batumi", "Kobuleti", "Kutaisi", "Senaki", "Georgia Center",
           "Oscar Sierra", "Mike Golf"]

# --- published fixes -------------------------------------------------------
#
# WHAT MAKES A FIX PUBLISHED is that somebody else can look it up: it is on a
# plate, in an AIP, or it is an aerodrome. A name only one party can resolve is
# worse than no name, because it reads as agreement -- see #133, and FEET WET,
# which is the same finding one level up.
#
# The 362nd's own turning points (FEET WET, INGRESS, EGRESS, TSUTSNVATI,
# REHEARSAL) are NOT here. They belong to the sortie that flies them.
#
# lat/lon are the SIM'S OWN projection, taken through `coord.LOtoLL` on
# 12 August 2026 and stored rather than asked for at every start. Caucasus is a
# transverse Mercator: a flat-earth offset from the field was measured at 1.2
# nm wrong at the coast and 7.6 nm wrong at the target area, so this must never
# be computed by us. `x`/`z` are the DCS grid metres the mission builder needs.

[[fix]]
name = "BATUMI"
ident = "OS"
x = -355811
z = 617386
lat = 41.609594
lon = 41.600234
freq_mhz = 132.0
sector = "Batumi Tower"
navaid_kind = "ndb"
source = "UGSB aerodrome reference point (the runway centre, which is what Airbase:getRunways() returns). THE BEACON ON IT IS FICTION: `OS` on 132.0 was INVENTED for the 1944 scenario, because an ARA-8 homes VHF and the real Batumi homer is `LU`, a 430 kHz LF NDB the adapter cannot steer on -- see the [[navaid]] rows below, which are the sim's own. Kept because the period letdown is flown on it; declared here because a fictional ident on a real aerodrome's row is exactly what this field exists to prevent. #163"
note = "Field elevation 32 ft. Landing runway 12 (charted 13/31 today -- magnetic drift renamed it; we fly the period AIP designation)."

[[fix]]
name = "KOBULETI"
ident = "MG"
x = -317962
z = 635633
lat = 41.929922
lon = 41.863275
freq_mhz = 124.0
sector = "Kobuleti Departure"
navaid_kind = "ndb"
source = "UG5X aerodrome reference. THE BEACON ON IT IS FICTION, like Batumi's: `MG` on 124.0 was INVENTED for the 1944 scenario -- Kobuleti's real homers are `KT` on 0.870 and `T` on 0.490 and its TACAN is `KBL` 67X, all in the [[navaid]] rows below. Kept because the letdown holds its banished aircraft here on that channel. #163"
note = "Field elevation 59 ft. Departure end. This point is 0.61 nm from the [[field]] row's own position, on the runway axis -- see #163, which measured it: one of the two is the runway centre and the other is the 07 threshold."

[[fix]]
name = "KUTAISI"
ident = "KT"
x = -284887
z = 683859
lat = 42.177619
lon = 42.481296
navaid_kind = "ndb"
source = "UGKO. Aerodrome; NDB KT."
note = "Red field. The transit turning point, not a diversion -- Batumi is the only blue aerodrome on the map."

# INITIAL IS NOT HERE ANY MORE, and where it went is the point. It used to be a
# fourth [[fix]] beside the three aerodromes, with an ident, a frequency and a
# source line admitting it was invented for this scenario. It is the initial
# approach fix of the 1944 Batumi letdown -- a procedure we made up, on a plate
# we generate -- so nothing outside that procedure could ever look it up.
#
#     "I created a private fix called INITIAL this seems to be conflicting with
#      a fix in your list"
#
# A real DKS cartridge carries a steerpoint of the same name thirteen miles
# away. His is real, ours is fiction, and his is the one the aeroplane will
# actually fly to -- so every import of a good flight plan warned about a
# collision with our own invention (#143, #144).
#
# It lives on the four approaches that use it now, as `[approach.own_point]`:
# same position, same ident SW, same 128.0, and no longer offered to a pilot
# who is not flying that letdown. A fix needs a NAME only if he can fly to it;
# the rest is geometry. See docs/CONFIG.md and #145.

# --- aerodromes ------------------------------------------------------------
#
# ADDING ONE IS ADDING A TABLE HERE. It used to mean editing core/fields.py,
# appending to a FIELDS tuple and redeploying the bridge, which is the whole of
# 'we're going to add dozens of airfields' stated as a code change.
#
# `runway` is the landing heading MAGNETIC; `ends` are the DESIGNATORS painted
# on the tarmac, and they are data rather than the heading rounded. Batumi's
# heading is 124, which rounds to 12 -- and DCS does call it 12 -- while the
# current AIP plate says 13/31 because magnetic drift renamed it and the paint
# caught up. Rounding gave 'runway 12' and 'runway 06', the numbers on nobody's
# chart. See #125 for the three magnetic variations this theatre has.
#
# msa_sectors are (from_bearing, to_bearing, altitude_ft); mva_cells are
# (from_bearing, to_bearing, range_nm, altitude_ft), sampled off the terrain.


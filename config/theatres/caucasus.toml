# Caucasus.
#
# THE MAP ITSELF IS A TABLE. `THEATRES = {"caucasus": caucasus, "nevada":
# nevada}` made adding a map mean writing a Python function; the identity of a
# theatre -- where the sortie starts and ends, which recovery is flown unless
# somebody says otherwise, what the wind is doing -- is data about the world.

[theatre]
name = "Caucasus"
terrain = "Caucasus"
departure = "Kobuleti"
arrival = "Batumi"
# WHICH ARRIVAL WHEN NOBODY HAS SAID. A stopgap, and the remainder of #2 is
# that there should be no such thing: which approach you are flying is a fact
# about your CLEARANCE, and until you have asked for one the honest answer is
# that the controller has none for you.
default_approach = "batumi-asr"
bootstrap_plan = "362nd-kobuleti-batumi"
wind_from_deg = 90.0
wind_mph = 5.7539

#
# Georgian place names, and the previous spellings were a disaster on the air.
# They used CAPITALS for the stressed syllable -- "Koh boo LEH tee" -- which is
# a convention for a human reader and nothing at all to Polly: a capitalised
# fragment gets read as an initialism or simply flattened, so the emphasis
# never landed and the seams between syllables did.
#
# Lower case throughout, and syllables joined with HYPHENS rather than spaces:
# a space is a word boundary and Polly pauses at it, which is what turned
# three-syllable place names into three separate words.

[pronunciation]
Batumi = "bah-too-mee"
Kobuleti = "koh-boo-lay-tee"
Senaki = "seh-nah-kee"
Kutaisi = "koo-tah-ee-see"
Sukhumi = "soo-koo-mee"
Vaziani = "vah-zee-ah-nee"
Tsutsnvati = "tsoots-nah-vah-tee"
Gudauta = "goo-dah-oo-tah"
Soganlug = "soh-gahn-loog"
Tbilisi = "tbil-ee-see"

# Names Whisper should expect on this map. Aerodromes and published fixes --
# NOT callsigns, which belong to whoever is flying today.
[recogniser]
phrases = ["Batumi", "Kobuleti", "Kutaisi", "Senaki", "Georgia Center",
           "Oscar Sierra", "Mike Golf"]

# --- published fixes -------------------------------------------------------
#
# WHAT MAKES A FIX PUBLISHED is that somebody else can look it up: it is on a
# plate, in an AIP, or it is an aerodrome. A name only one party can resolve is
# worse than no name, because it reads as agreement -- see #133, and FEET WET,
# which is the same finding one level up.
#
# The 362nd's own turning points (FEET WET, INGRESS, EGRESS, TSUTSNVATI,
# REHEARSAL) are NOT here. They belong to the sortie that flies them.
#
# lat/lon are the SIM'S OWN projection, taken through `coord.LOtoLL` on
# 12 August 2026 and stored rather than asked for at every start. Caucasus is a
# transverse Mercator: a flat-earth offset from the field was measured at 1.2
# nm wrong at the coast and 7.6 nm wrong at the target area, so this must never
# be computed by us. `x`/`z` are the DCS grid metres the mission builder needs.

[[fix]]
name = "BATUMI"
ident = "OS"
x = -355811
z = 617386
lat = 41.609594
lon = 41.600234
freq_mhz = 132.0
sector = "Batumi Tower"
navaid = "ndb"
source = "UGSB. Aerodrome; NDB OS 132.0 on the AIP plate."
note = "Field elevation 32 ft. Landing runway 12 (charted 13/31 today -- magnetic drift renamed it; we fly the period AIP designation)."

[[fix]]
name = "KOBULETI"
ident = "MG"
x = -317962
z = 635633
lat = 41.929922
lon = 41.863275
freq_mhz = 124.0
sector = "Kobuleti Departure"
navaid = "ndb"
source = "UG5X. Aerodrome; NDB MG 124.0."
note = "Field elevation 59 ft. Departure end."

[[fix]]
name = "KUTAISI"
ident = "KT"
x = -284887
z = 683859
lat = 42.177619
lon = 42.481296
navaid = "ndb"
source = "UGKO. Aerodrome; NDB KT."

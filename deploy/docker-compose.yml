# Marshall services, to run on the LXC beside the sim server.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Today: the kneeboard chart server. The ATC (SRS client) and the telemetry map
# drop in as further services as they are built.
#
# Public access is handled OFF this host by an external Nginx Proxy Manager,
# which terminates TLS and reverse-proxies to this LXC on port 80. Marshall
# itself stays plain HTTP -- no TLS, no front-door proxy in this repo.
#
#   NPM proxy host:  marshall.epetersons.com  ->  http://<lxc-ip>:80
#   OpenKneeboard Web Dashboard:  http://<lxc-ip>/kneeboard/
#                          (or)   https://marshall.epetersons.com/kneeboard/
#
# SECURITY (carried over from the old Caddyfile): the static charts under
# /kneeboard/ are safe to serve openly. The flight-planning app being added at /
# is NOT -- it shells out to pydcs and deploys files, so an open mutating
# endpoint is remote code execution. Its write routes MUST be behind auth (a
# FastAPI dependency, or an NPM access list) before marshall.epetersons.com is
# reachable from the internet.

services:
  kneeboard:
    build:
      context: ..
      dockerfile: deploy/kneeboard.Dockerfile
    image: marshall-kneeboard
    container_name: marshall-kneeboard
    restart: unless-stopped
    # Host 80 -> container 8362 (the app's port). NPM forwards to <lxc-ip>:80.
    ports:
      - "80:8362"
    # The charts are RENDERED PER REQUEST from this source, so a restart is no
    # longer part of editing one -- see the freshness note in serve.py. The
    # mount is what makes that possible: without it the server would faithfully
    # serve whatever code was copied in at image-build time, which it did for
    # months, still showing beacon frequencies for a field that had moved to a
    # radar approach.
    #
    # docs/ is mounted for the flight-test kneeboard at /flighttest/, which is
    # built from TEST_PLAN.md and ISSUES.md. Without it that page renders empty
    # -- and an empty test card reads as "nothing to test" rather than as a
    # missing mount.
    #
    # build/vendor holds mermaid, which the /docs pages need to draw their
    # diagrams. MARSHALL_BUILD is /data in here, so that is where the server
    # looks. Without the mount the pages fall back to the CDN and say so in the
    # corner -- which works from a desk and does not work inside
    # OpenKneeboard's Chromium, and a diagram that silently fails to draw looks
    # exactly like a diagram nobody wrote. Populate it with tools/vendor.sh.
    volumes:
      - ../src:/app/src:ro
      - ../docs:/app/docs:ro
      - ../build/vendor:/data/vendor:ro
      # The flight recorder, which /diag reads. The BRIDGE writes it on the
      # host; this container only ever reads. Without it the diagnostics page
      # renders empty, which looks exactly like a quiet frequency.
      - ../build/logs:/data/logs:ro
    # The PLANS page reads the filed flight plans from the director LIVE, and
    # the director is published on the HOST -- inside this container `localhost`
    # is this container. Without the gateway alias the page renders "nobody
    # answered", which is at least honest, but it is not the board.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Make the mounted source win over the copy pip installed into
      # site-packages, or the mount is decorative.
      PYTHONPATH: /app/src
      MARSHALL_DIRECTOR_URL: http://host.docker.internal:8000

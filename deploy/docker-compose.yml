# Marshall services, to run on the LXC beside the sim server.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Today: the kneeboard chart server. The ATC (SRS client) and the telemetry map
# drop in as further services as they are built.
#
# Public access is handled OFF this host by an external Nginx Proxy Manager,
# which terminates TLS and reverse-proxies to this LXC on port 80. Marshall
# itself stays plain HTTP -- no TLS, no front-door proxy in this repo.
#
#   NPM proxy host:  marshall.epetersons.com  ->  http://<lxc-ip>:80
#   OpenKneeboard Web Dashboard:  http://<lxc-ip>/kneeboard/
#                          (or)   https://marshall.epetersons.com/kneeboard/
#
# SECURITY (carried over from the old Caddyfile): the static charts under
# /kneeboard/ are safe to serve openly. The flight-planning app being added at /
# is NOT -- it shells out to pydcs and deploys files, so an open mutating
# endpoint is remote code execution. Its write routes MUST be behind auth (a
# FastAPI dependency, or an NPM access list) before marshall.epetersons.com is
# reachable from the internet.

services:
  kneeboard:
    build:
      context: ..
      dockerfile: deploy/kneeboard.Dockerfile
    image: marshall-kneeboard
    container_name: marshall-kneeboard
    restart: unless-stopped
    # Host 80 -> container 8362 (the app's port). NPM forwards to <lxc-ip>:80.
    ports:
      - "80:8362"
    # The charts are DATA, regenerated from the source at every container start.
    # That source is mounted rather than only baked into the image: without the
    # mount a restart faithfully regenerates the charts from whatever code was
    # copied in at image-build time, so editing a chart on the host changed
    # nothing and the server quietly served a stale kneeboard. It did exactly
    # that -- still showing beacon frequencies that no longer existed after the
    # field moved to a radar approach.
    volumes:
      - ../src:/app/src:ro
    environment:
      # Make the mounted source win over the copy pip installed into
      # site-packages, or the mount is decorative.
      PYTHONPATH: /app/src
